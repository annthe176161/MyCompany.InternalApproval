<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d4ed8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(6, 5)" filter="url(#badgeShadow)">
    <rect width="40" height="40" rx="10" fill="url(#logoGrad)" />
    <!-- Subtle Inner Border -->
    <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <!-- Approval Shield & Checkmark -->
    <path d="M20 9L11 13V19.5C11 25.5 14.8 30.5 20 32C25.2 30.5 29 25.5 29 19.5V13L20 9Z" 
          fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bold Checkmark in Center -->
    <path d="M15.5 20.5L18.5 23.5L24.5 17.5" 
          fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(56, 15)">
    <!-- Main Title -->
    <text x="0" y="12" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14.5" 
          font-weight="700" 
          letter-spacing="0.5" 
          fill="#ffffff">INTERNAL APPROVAL</text>
    
    <!-- Subtitle Badge -->
    <text x="0" y="26" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="9" 
          font-weight="600" 
          letter-spacing="1.2" 
          fill="url(#glowGrad)">HỆ THỐNG PHÊ DUYỆT</text>
  </g>
</svg>
