<nz-modal
  [(nzVisible)]="visible"
  [nzTitle]="'Phân quyền — ' + entityTitle"
  [nzWidth]="760"
  (nzOnCancel)="close()"
  [nzFooter]="modalFooterTpl"
  [nzMaskClosable]="false"
>
  <ng-container *nzModalContent>
    <nz-spin [nzSpinning]="isLoading">
      <!-- Thanh trên cùng: Chọn tất cả + Tìm kiếm nhanh -->
      <div class="perm-top-bar">
        <label
          nz-checkbox
          [ngModel]="isAllGranted"
          [nzIndeterminate]="isAllIndeterminate"
          (ngModelChange)="toggleAllPermissions($event)"
          class="select-all-label"
        >
          Cấp tất cả các quyền
        </label>

        <input
          type="text"
          nz-input
          class="perm-search-input"
          placeholder="Tìm tên quyền..."
          [(ngModel)]="searchKeyword"
          (ngModelChange)="onSearchChange()"
        />
      </div>

      <!-- Bố cục 2 cột đơn giản, rõ ràng -->
      <div class="perm-body-grid">
        <!-- Cột trái: Danh sách nhóm quyền -->
        <div class="perm-left-groups" *ngIf="!searchKeyword.trim()">
          <div
            *ngFor="let grp of groups; let idx = index"
            class="group-tab-item"
            [class.active]="idx === selectedGroupIndex"
            (click)="selectGroup(idx)"
          >
            <span class="group-tab-name">{{ getGroupDisplayName(grp) }}</span>
            <span class="group-tab-count">
              ({{ getGrantedCountInGroup(grp) }}/{{ grp.permissions?.length || 0 }})
            </span>
          </div>
        </div>

        <!-- Cột phải: Danh sách checkbox quyền -->
        <div class="perm-right-list">
          <!-- Chọn tất cả trong nhóm hiện tại -->
          <div class="group-check-all-row" *ngIf="!searchKeyword.trim() && groups.length > 0">
            <label
              nz-checkbox
              [ngModel]="isCurrentGroupAllGranted"
              [nzIndeterminate]="isCurrentGroupIndeterminate"
              (ngModelChange)="toggleCurrentGroupPermissions($event)"
            >
              <strong>Chọn tất cả mục này</strong>
            </label>
          </div>

          <div class="perm-items-scroll" *ngIf="displayedPermissions.length > 0; else emptyTpl">
            <div
              *ngFor="let item of displayedPermissions"
              class="perm-row-item"
              [class.is-parent-row]="item.level === 0"
              [style.padding-left.px]="item.level * 24"
            >
              <label
                nz-checkbox
                [ngModel]="item.isGranted"
                [nzDisabled]="item.isDisabled"
                (ngModelChange)="onTogglePermission(item, $event)"
              >
                <span [class.fw-semibold]="item.level === 0">{{ item.displayName }}</span>
              </label>

              <span class="role-inherited-note" *ngIf="item.grantedByRoles.length > 0">
                (Từ vai trò: {{ item.grantedByRoles.join(', ') }})
              </span>
            </div>
          </div>

          <ng-template #emptyTpl>
            <div class="empty-box" *ngIf="!isLoading">
              Không có quyền nào khớp với tìm kiếm.
            </div>
          </ng-template>
        </div>
      </div>
    </nz-spin>
  </ng-container>

  <ng-template #modalFooterTpl>
    <button nz-button nzType="default" (click)="close()" [disabled]="isSaving">
      Hủy
    </button>
    <button nz-button nzType="primary" (click)="save()" [nzLoading]="isSaving">
      Lưu thay đổi
    </button>
  </ng-template>
</nz-modal>
